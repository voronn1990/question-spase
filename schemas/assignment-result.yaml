schema_version: "question-space-v4"
id: "SCHEMA-ASSIGNMENT-RESULT"
assignment_required_fields: ["assignment_id", "attempt_id", "role_id", "agent_id", "input_snapshot", "artifact_type", "output_path", "dependency_hashes", "result_id"]
artifact_types: ["FRAMING", "PRIMARY", "OPERATOR", "ANSWER", "SOURCE_OUTCOMES", "EVIDENCE", "HYPOTHESIS", "DECISION", "REVIEW", "EXPERIMENT", "SYNTHESIS", "PLAN", "FINAL_AUDIT"]
source_outcomes: "versioned accepted SOURCE_OUTCOMES results at answers/source-outcomes/<result_id>.yaml; state/current.yaml selects one exact current revision; records contain SOURCE_OUTCOME and DERIVED_Q items and are never written into input/bank.yaml"
strict_boolean_enums: {criticality: ["CRITICAL", "NONCRITICAL"], changed: ["CHANGED", "UNCHANGED"]}
result_required_fields: ["schema_version", "id", "run_id", "input_snapshot", "author_role", "agent_id", "knowledge_status", "workflow_status", "source_refs", "related_ids", "revision", "created_at", "updated_at"]
idempotency_key: ["assignment_id", "attempt_id", "exact_result_sha256"]
intent_commit_durability: "intent and committed transaction retain exact assignment bytes and SHA-256; a commit also retains exact result bytes and SHA-256; recovery verifies intent-to-commit byte identity before rebuilding mutable indexes"

new_mode_lifecycle: "GOAL_TO_PLAN and BANK_TO_PLAN require lifecycle_scope PREP or CORE. Every CORE assignment carries its exact prep_admission_sha256 through assignment intent, launch journal, ROLE_CONTEXT, accepted result, registry entry, and committed transaction top level plus transaction assignment/entry; validate, recover, seal and verify reject an omitted or mismatched copy. PREP-2 FRAMING repeats prep_stage PREP-2_PERSPECTIVES, goal_result_id, vector_sha256, approval_sha256, perspective_profile and perspective_profile_hash; accepted result.vector_result_id equals assignment.goal_result_id. Its result also requires context_packet_sha256 equal to exact state/contexts/<assignment_id>--<attempt_id>.yaml and blind_input containing contains_bank NO, contains_foreign_p_results NO, contains_preferred_solution NO, plus nonempty duplicate-free string allowed; protocol/freeze/continuity provenance fields are permitted."
perspective_map: "input/perspective-map.yaml is exact immutable Root input with rows P-01 through P-10, distinct agent_id and profile_sha256 over exactly role_id, agent_id, title, competence, analysis_scope, unique_contribution, boundary, plausible_blindspots."
prep_admission_question_count: "prep-admission.question_count is canonical quoted decimal text: 0 or a nonzero digit followed by decimal digits; implicit YAML numeric scalars are forbidden."
prep_expansion_context: "Before GOAL_TO_PLAN admission, PREP-3_EXPAND_NORMALIZE may address only assignment.assigned_ids.questions resolved from accepted PREP-2 initial_questions. Every source FRAMING result ID must be declared in dependency_result_ids and its exact accepted hash in dependency_hashes. Requirements resolve solely from the approved Vector requirement_definitions. The generated PREP_EXPANSION_CONTEXT remains bank ABSENT and carries question/source-result/hash/role bindings plus approved Vector G/NOT_G, requirement definitions and declared boundaries. Its accepted_dependencies use CONTEXT_DEPENDENCY_PROJECTION_V1: each source result_id/artifact_type/path/sha256/role_id remains addressable while a default FRAMING view contains only assigned initial_questions, PRIMARY/ANSWER contains only assigned claims, and other sources are provenance-only. A complete document is permitted only under explicit --expand for an exact linked accepted result; a later expansion cannot rewrite a saved context packet."
prep_initial_questions_policy: "A new GOAL_TO_PLAN snapshot and its PREP_FRAMING_CONTEXT carry MATERIAL_UNKNOWNS_V1. The GOAL result requires a list initial_questions. GOAL snapshots without the policy retain ten rows per perspective and one hundred total. Other policy values or a policy on BANK_TO_PLAN are invalid. All ten current empty sets block GOAL admission."
prep_empty_initial_questions: "For an empty list under MATERIAL_UNKNOWNS_V1, empty_initial_questions_rationale maps analysis_scope to the exact delivered profile scope, basis_refs to a nonempty list of delivered Vector IDs or material paths, and explanation to a substantive explanation. The existing PREP-4 Root PERSPECTIVES_DISTINCT_NECESSARY perspective_assessments row for this role requires empty_initial_questions_assessment with the exact current result_id and sha256, outcome PASS, substantive basis and resolvable basis_refs including the frame grounds."
prep_initial_framing_inventory: "Under MATERIAL_UNKNOWNS_V1, PREP-3 and PREP-4 resolve one current accepted FRAMING per role from exact assignment attempt lineage. The current result may supersede a terminal predecessor through supersedes_attempt_id within the same assignment. Initial IQ IDs and rows remain bound to their first accepted result across retries. The normalized lineage requires exactly the FRAMING IDs for its cited initial IQs and exactly the actual roles for all cited results. Every initial IQ requires normalized lineage. Core coverage uses the admission-bound current FRAMING IDs."
prep_expansion_provenance: "Under MATERIAL_UNKNOWNS_V1, every extra normalized origin must resolve through expansion_bindings with the exact accepted PREP-3 result ID and sha256 and an immutable PREP_EXPANSION_CONTEXT. A proposal in resulting_questions has the material question fields, a local id without '/', and source_initial_question_ids. Cite result_id/id in lineage.source_question_ids, the result in source_result_ids, and all of the proposal's assigned parent IQs with their own FRAMING. With no parents, use the delivered Vector result ID in g_refs, delivered assigned R in r_refs and delivered Vector values in not_g_refs, with at least one R or NOT_G. This proposal may support DERIVED_UNKNOWN. Proposal references do not count toward initial IQ coverage. Without proposals, an accepted PRIMARY or ANSWER may support lineage through a matching addressed_q_ids or per_question_outcomes.q_id claim for an assigned and cited initial IQ."
prep_initial_question_fields: "Each PREP-2 initial_questions row has nonempty string id, unknown, why_material, changeable_decision, applicability and evidence_needed; g_refs, r_refs and not_g_refs are lists of strings, g_refs is nonempty, and origin_role is a nonempty string."

blind_framing_contract: "FRAMING requires role P-*, empty assigned_ids/dependencies and an assignment-bound bank-free blind_handoff; existing assignment.allowed_reads may select exact immutable approved brief materials, defaults to none, forbids automatic all-material injection and exact bank/foreign-result bindings, and emits selected material content once; context --expand is forbidden"
double_iceberg_contract: "when snapshot methodology_features contains DOUBLE_ICEBERG_V1, all ten blind FRAMING results require typed nonempty iceberg_position; OP-PROJECTION and OP-REVERSE accepted OPERATOR results own exact CURRENT_REALITY and DESIRED_REALITY views respectively; SYNTHESIS binds both unique non-stale heads; no new artifact type is introduced"
